name: Build Latest Ludo Legends APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'
      - name: Verify latest source architecture
        run: |
          test -f app/src/main/java/com/ludolegends/game/engine/LudoModels.kt
          test -f app/src/main/java/com/ludolegends/game/vm/GameViewModel.kt
          test -f app/src/main/java/com/ludolegends/game/ui/board/LudoBoardCanvas.kt
          grep -q 'versionName = "6.0.0"' app/build.gradle.kts
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build latest debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: APK identity and checksum
        run: |
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -3
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Ludo-Legends-v6-latest-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
